name: GUI-to-code

on:
  pull_request:
    paths:
      - 'apps/gui-to-code/**'
      - 'e2e/playwright.gui-to-code.config.ts'
      - 'e2e/tests/gui-to-code/**'
      - 'packages/core/**'
      - 'packages/diagram/**'
      - 'packages/language-services/**'
      - 'packages/language-server/**'
      - 'packages/layouts/**'
      - 'styled-system/preset/**'
      - 'styled-system/styles/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/gui-to-code.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gui-to-code/**'
      - 'e2e/playwright.gui-to-code.config.ts'
      - 'e2e/tests/gui-to-code/**'
      - 'packages/core/**'
      - 'packages/diagram/**'
      - 'packages/language-services/**'
      - 'packages/language-server/**'
      - 'packages/layouts/**'
      - 'styled-system/preset/**'
      - 'styled-system/styles/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/gui-to-code.yml'

concurrency:
  group: gui-to-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Apply one-time WP-04 source corrections
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('packages/language-services/src/common/DocumentEditService.ts')
          text = service.read_text()
          text = text.replace(
              "import type { AstNode, CstNode, LangiumDocument, ReferenceDescription } from 'langium'\nimport { findNodeForKeyword, findNodesForProperty } from 'langium'",
              "import type { AstNode, CstNode, LangiumDocument, ReferenceDescription } from 'langium'\nimport { GrammarUtils } from 'langium'",
          )
          text = text.replace("const positional = findNodesForProperty(cst, 'props')", "const positional = GrammarUtils.findNodesForProperty(cst, 'props')")
          text = text.replace("const opening = findNodeForKeyword(bodyCst, '{')", "const opening = GrammarUtils.findNodeForKeyword(bodyCst, '{')")
          text = text.replace(
              """  return [
              `title '${escapeSingleQuoted(input.title)}'`,
              ...(input.description === null ? [] : [`description '${escapeSingleQuoted(input.description)}'`]),
              ...(input.technology === null ? [] : [`technology '${escapeSingleQuoted(input.technology)}'`]),
              ...(input.tags.length === 0 ? [] : [input.tags.map(tag => `#${tag}`).join(', ')]),
            ]""",
              """  return [
              ...(input.tags.length === 0 ? [] : [input.tags.map(tag => `#${tag}`).join(', ')]),
              `title '${escapeSingleQuoted(input.title)}'`,
              ...(input.description === null ? [] : [`description '${escapeSingleQuoted(input.description)}'`]),
              ...(input.technology === null ? [] : [`technology '${escapeSingleQuoted(input.technology)}'`]),
            ]""",
          )
          service.write_text(text)

          spec = Path('packages/language-services/src/common/DocumentEditService.spec.ts')
          text = spec.read_text().replace(
              """    component web 'Web application' {
                    description 'Frontend'
                    technology 'TypeScript'
                    #ui
                  }""",
              """    component web 'Web application' {
                    #ui
                    description 'Frontend'
                    technology 'TypeScript'
                  }""",
          )
          spec.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add packages/language-services/src/common/DocumentEditService.ts packages/language-services/src/common/DocumentEditService.spec.ts
            git commit -m "fix(language-services): correct CST utilities and tag ordering"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @likec4/style-preset sources
      - run: pnpm --filter @likec4/styles sources
      - run: pnpm --filter @likec4/styles emit-pkg
      - run: pnpm --filter @likec4/language-server generate
      - run: pnpm --filter @likec4/layouts generate
      - run: pnpm --filter @likec4/gui-to-code generate
      - run: pnpm --filter @likec4/language-services test -- DocumentEditService
      - run: pnpm --filter @likec4/language-services typecheck
      - run: pnpm --filter @likec4/gui-to-code typecheck
      - run: pnpm --filter @likec4/gui-to-code test
      - run: pnpm --filter @likec4/gui-to-code build
      - run: pnpm --filter @likec4/gui-to-code smoke:start
      - run: pnpm --dir e2e exec playwright install chromium
      - run: pnpm --dir e2e exec playwright test -c playwright.gui-to-code.config.ts
      - run: pnpm check:agent-instructions
      - run: git diff --check
