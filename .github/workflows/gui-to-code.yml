name: GUI-to-code

on:
  pull_request:
    paths:
      - 'apps/gui-to-code/**'
      - 'e2e/playwright.gui-to-code.config.ts'
      - 'e2e/tests/gui-to-code/**'
      - 'packages/core/**'
      - 'packages/diagram/**'
      - 'packages/language-services/**'
      - 'packages/language-server/**'
      - 'packages/layouts/**'
      - 'styled-system/preset/**'
      - 'styled-system/styles/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/gui-to-code.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gui-to-code/**'
      - 'e2e/playwright.gui-to-code.config.ts'
      - 'e2e/tests/gui-to-code/**'
      - 'packages/core/**'
      - 'packages/diagram/**'
      - 'packages/language-services/**'
      - 'packages/language-server/**'
      - 'packages/layouts/**'
      - 'styled-system/preset/**'
      - 'styled-system/styles/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/gui-to-code.yml'

concurrency:
  group: gui-to-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @likec4/style-preset sources
      - run: pnpm --filter @likec4/styles sources
      - run: pnpm --filter @likec4/styles emit-pkg
      - run: pnpm --filter @likec4/language-server generate
      - run: pnpm --filter @likec4/layouts generate
      - run: pnpm --filter @likec4/gui-to-code generate
      - run: pnpm --filter @likec4/language-services test -- DocumentEditService
      - run: pnpm --filter @likec4/language-services typecheck
      - run: pnpm --filter @likec4/gui-to-code typecheck
      - run: pnpm --filter @likec4/gui-to-code test
      - run: pnpm --filter @likec4/gui-to-code build
      - run: pnpm --filter @likec4/gui-to-code smoke:start
      - run: pnpm run pretest:e2e
      - run: pnpm install --no-lockfile
        working-directory: e2e
      - run: pnpm install:chromium
        working-directory: e2e
      - name: Run GUI-to-code Playwright acceptance
        run: pnpm exec playwright test -c playwright.gui-to-code.config.ts
        working-directory: e2e
      - name: Upload GUI-to-code Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-to-code-playwright-report
          path: |
            e2e/playwright-report/gui-to-code
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm check:agent-instructions
      - run: git diff --check
