name: WP-06 discovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contract manifest
        shell: bash
        run: |
          echo 'LANGIUM_OWNERS'
          grep -RlE 'DynamicView|DeploymentView|DeploymentNode|instanceOf' packages --include='*.langium' | sort
          echo 'DYNAMIC_OWNERS'
          grep -RlE 'class DynamicViewParser|interface DynamicView|type DynamicView' packages --include='*.ts' | sort | head -n 30
          echo 'DEPLOYMENT_OWNERS'
          grep -RlE 'DeploymentView|DeploymentNode|instanceOf' packages --include='*.ts' | sort | head -n 50
          echo 'FIXTURES'
          grep -RlE 'dynamic view|deployment view|instanceOf' packages apps e2e --include='*.c4' --include='*.likec4' --include='*.ts' | sort | head -n 80
          echo 'GRAMMAR_SIGNATURES'
          for file in $(grep -RlE 'DynamicView|DeploymentView|DeploymentNode|instanceOf' packages --include='*.langium' | sort); do
            echo "FILE=$file"
            grep -nE 'DynamicView|DeploymentView|DeploymentNode|instanceOf|DynamicStep|DeploymentRelation' "$file" | head -n 80
          done
          echo 'MODEL_SIGNATURES'
          for file in $(grep -RlE 'class DynamicViewParser|DeploymentView|DeploymentNode|instanceOf' packages --include='*.ts' | sort | head -n 20); do
            echo "FILE=$file"
            grep -nE 'class DynamicViewParser|interface DynamicView|type DynamicView|DeploymentView|DeploymentNode|instanceOf' "$file" | head -n 40
          done
