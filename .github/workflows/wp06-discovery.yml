name: WP-06 discovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contract manifest
        shell: bash
        run: |
          echo 'MODEL_LOCATOR_FILES'
          grep -Rl 'class ModelLocator' packages/language-server/src --include='*.ts' | sort
          echo 'MODEL_LOCATOR_METHODS'
          for file in $(grep -Rl 'class ModelLocator' packages/language-server/src --include='*.ts' | sort); do
            echo "FILE=$file"
            grep -nE 'getParsed|Deployment|View' "$file" | head -n 120
          done
          echo 'PARSED_MODEL_SHAPE'
          grep -RIn -B 3 -A 12 --include='*.ts' -E 'deploymentElements|deployments:|deployment:' packages/core/src packages/language-server/src/model | head -n 240 || true
