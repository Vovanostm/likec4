name: WP-06 apply integration

on:
  push:
    branches:
      - feat/gui-to-code-wp06-dynamic-deployment

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gui-to-code-wp06-dynamic-deployment
      - name: Apply integration patch
        shell: bash
        run: |
          if test -f apps/gui-to-code/.wp06-workspace-integrated; then
            echo 'WP-06 workspace integration already applied'
            exit 0
          fi
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          contracts = 'apps/gui-to-code/src/editor/contracts.ts'
          replace(contracts,
          "export interface ElementPatch {\n",
          """export interface CreateDynamicViewEditInput {
            readonly id: string
            readonly title?: string
            readonly documentUri?: string
          }

          export interface CreateDynamicStepEditInput {
            readonly viewId: ViewId
            readonly sourceId: Fqn
            readonly targetId: Fqn
            readonly documentUri?: string
          }

          export interface CreateDeploymentViewEditInput {
            readonly id: string
            readonly title?: string
            readonly documentUri?: string
          }

          export interface CreateDeploymentNodeEditInput {
            readonly family: 'node'
            readonly id: string
            readonly kind: string
            readonly title?: string
            readonly documentUri?: string
          }

          export interface CreateDeploymentInstanceEditInput {
            readonly family: 'instance'
            readonly id: string
            readonly target: Fqn
            readonly documentUri?: string
          }

          export type CreateDeploymentElementEditInput = CreateDeploymentNodeEditInput | CreateDeploymentInstanceEditInput

          export interface CreateDeploymentRelationEditInput {
            readonly sourceId: Fqn
            readonly targetId: Fqn
            readonly documentUri?: string
          }

          export interface ElementPatch {
          """)

          replace(contracts,
          "  createView(sources: readonly SourceFile[], input: CreateViewEditInput): Promise<readonly SourceFile[]>\n",
          """  createView(sources: readonly SourceFile[], input: CreateViewEditInput): Promise<readonly SourceFile[]>
            createDynamicView(sources: readonly SourceFile[], input: CreateDynamicViewEditInput): Promise<readonly SourceFile[]>
            createDynamicStep(sources: readonly SourceFile[], input: CreateDynamicStepEditInput): Promise<readonly SourceFile[]>
            createDeploymentView(sources: readonly SourceFile[], input: CreateDeploymentViewEditInput): Promise<readonly SourceFile[]>
            createDeploymentNode(sources: readonly SourceFile[], input: CreateDeploymentNodeEditInput): Promise<readonly SourceFile[]>
            createDeploymentInstance(sources: readonly SourceFile[], input: CreateDeploymentInstanceEditInput): Promise<readonly SourceFile[]>
            createDeploymentRelation(sources: readonly SourceFile[], input: CreateDeploymentRelationEditInput): Promise<readonly SourceFile[]>
          """)

          replace(contracts,
          "export type EditorCommand =\n",
          """export interface CreateDynamicViewCommand {
            readonly type: 'dynamicView.create'
            readonly input: CreateDynamicViewEditInput
          }

          export interface CreateDynamicStepCommand {
            readonly type: 'dynamicStep.create'
            readonly input: CreateDynamicStepEditInput
          }

          export interface CreateDeploymentViewCommand {
            readonly type: 'deploymentView.create'
            readonly input: CreateDeploymentViewEditInput
          }

          export interface CreateDeploymentElementCommand {
            readonly type: 'deploymentElement.create'
            readonly input: CreateDeploymentElementEditInput
          }

          export interface CreateDeploymentRelationCommand {
            readonly type: 'deploymentRelation.create'
            readonly input: CreateDeploymentRelationEditInput
          }

          export type EditorCommand =
          """)

          replace(contracts,
          "  | CreateViewCommand\n",
          """  | CreateViewCommand
            | CreateDynamicViewCommand
            | CreateDynamicStepCommand
            | CreateDeploymentViewCommand
            | CreateDeploymentElementCommand
            | CreateDeploymentRelationCommand
          """)

          replace(contracts,
          "  | 'combined-operation-unsupported'\n",
          """  | 'dynamic-view-not-found'
            | 'dynamic-view-verification-failed'
            | 'dynamic-step-verification-failed'
            | 'deployment-kind-unsupported'
            | 'deployment-id-collision'
            | 'deployment-view-verification-failed'
            | 'deployment-element-verification-failed'
            | 'deployment-relation-verification-failed'
            | 'semantic-endpoint-not-found'
            | 'semantic-reference-not-found'
            | 'semantic-operation-invalid'
            | 'ambiguous-target-document'
            | 'stale-source-edit'
            | 'wp06-source-edit-failed'
            | 'combined-operation-unsupported'
          """)

          replace(contracts,
          "  | {\n    readonly status: 'applied'\n    readonly command: 'layout.save' | 'layout.reset'\n",
          """  | {
              readonly status: 'applied'
              readonly command: 'dynamicView.create' | 'deploymentView.create'
              readonly revision: Revision
              readonly createdViewId: ViewId
            }
            | {
              readonly status: 'applied'
              readonly command: 'dynamicStep.create'
              readonly revision: Revision
              readonly createdStepId: string
              readonly viewId: ViewId
            }
            | {
              readonly status: 'applied'
              readonly command: 'deploymentElement.create'
              readonly revision: Revision
              readonly createdDeploymentId: Fqn
            }
            | {
              readonly status: 'applied'
              readonly command: 'deploymentRelation.create'
              readonly revision: Revision
              readonly createdRelationId: RelationId
            }
            | {
              readonly status: 'applied'
              readonly command: 'layout.save' | 'layout.reset'
          """)

          adapter = 'apps/gui-to-code/src/editor/language-services-adapter.ts'
          replace(adapter,
          "  createElementViewDocumentEditService,\n",
          "  createElementViewDocumentEditService,\n  createDynamicDeploymentDocumentEditService,\n")
          replace(adapter,
          "    views: createElementViewDocumentEditService(likec4),\n",
          "    views: createElementViewDocumentEditService(likec4),\n    semantics: createDynamicDeploymentDocumentEditService(likec4),\n")
          replace(adapter,
          "  async patchElement(sources, input) {\n",
          """  async createDynamicView(sources, input) {
              try {
                const { semantics } = await serviceFor(sources)
                return applyPlan(sources, await semantics.planAddDynamicView(input))
              } catch (error) {
                return documentError(error)
              }
            },

            async createDynamicStep(sources, input) {
              try {
                const { semantics } = await serviceFor(sources)
                return applyPlan(sources, await semantics.planAddDynamicStep({
                  viewId: input.viewId,
                  source: input.sourceId,
                  target: input.targetId,
                  ...(input.documentUri ? { documentUri: input.documentUri } : {}),
                }))
              } catch (error) {
                return documentError(error)
              }
            },

            async createDeploymentView(sources, input) {
              try {
                const { semantics } = await serviceFor(sources)
                return applyPlan(sources, await semantics.planAddDeploymentView(input))
              } catch (error) {
                return documentError(error)
              }
            },

            async createDeploymentNode(sources, input) {
              try {
                const { semantics } = await serviceFor(sources)
                return applyPlan(sources, await semantics.planAddDeploymentNode(input))
              } catch (error) {
                return documentError(error)
              }
            },

            async createDeploymentInstance(sources, input) {
              try {
                const { semantics } = await serviceFor(sources)
                return applyPlan(sources, await semantics.planAddDeploymentInstance(input))
              } catch (error) {
                return documentError(error)
              }
            },

            async createDeploymentRelation(sources, input) {
              try {
                const { semantics } = await serviceFor(sources)
                return applyPlan(sources, await semantics.planAddDeploymentRelation({
                  source: input.sourceId,
                  target: input.targetId,
                  ...(input.documentUri ? { documentUri: input.documentUri } : {}),
                }))
              } catch (error) {
                return documentError(error)
              }
            },

            async patchElement(sources, input) {
          """)

          workspace = 'apps/gui-to-code/src/editor/workspace.ts'
          replace(workspace,
          "import { EditorDocumentError } from './contracts'\n",
          "import { EditorDocumentError } from './contracts'\nimport { applyWp06Command } from './wp06-workspace'\n")
          replace(workspace,
          "  async patchElement(sources, input) {\n",
          """  async createDynamicView(sources, input) {
              return (await defaultPort()).createDynamicView(sources, input)
            },
            async createDynamicStep(sources, input) {
              return (await defaultPort()).createDynamicStep(sources, input)
            },
            async createDeploymentView(sources, input) {
              return (await defaultPort()).createDeploymentView(sources, input)
            },
            async createDeploymentNode(sources, input) {
              return (await defaultPort()).createDeploymentNode(sources, input)
            },
            async createDeploymentInstance(sources, input) {
              return (await defaultPort()).createDeploymentInstance(sources, input)
            },
            async createDeploymentRelation(sources, input) {
              return (await defaultPort()).createDeploymentRelation(sources, input)
            },
            async patchElement(sources, input) {
          """)
          replace(workspace,
          "      case 'element.patch':\n",
          """      case 'dynamicView.create':
              case 'dynamicStep.create':
              case 'deploymentView.create':
              case 'deploymentElement.create':
              case 'deploymentRelation.create':
                return applyWp06Command({
                  state,
                  command: operation.semantic,
                  documents: this.documents,
                  compileCandidate: (revision, sources) => this.compileCandidate(revision, sources),
                  commitCandidate: (revision, sources, model, layouts) =>
                    this.commitCandidate(state, revision, sources, model, layouts),
                  isCurrent: () => this.isCurrent(state),
                  currentRevision: () => this.current.revision,
                })
              case 'element.patch':
          """)

          Path('apps/gui-to-code/.wp06-workspace-integrated').write_text('WP-06 workspace contracts integrated by GitHub CI\n')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gui-to-code
          git commit -m 'feat(gui-to-code): connect WP-06 workspace commands'
          git push origin HEAD:feat/gui-to-code-wp06-dynamic-deployment
