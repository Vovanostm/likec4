name: WP03 format

on:
  push:
    branches:
      - feat/gui-to-code-wp03-relation-undo

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gui-to-code-wp03-relation-undo
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP-03 files
        run: >-
          pnpm exec dprint fmt
          packages/language-services/src/common/DocumentEditService.ts
          packages/language-services/src/common/DocumentEditService.spec.ts
          packages/language-services/src/browser/index.ts
          packages/language-services/src/node/index.ts
          packages/diagram/src/LikeC4Diagram.props.ts
          packages/diagram/src/LikeC4Diagram.tsx
          packages/diagram/src/context/DiagramEventHandlers.tsx
          packages/diagram/src/likec4diagram/DiagramXYFlow.tsx
          apps/gui-to-code/src/App.tsx
          apps/gui-to-code/src/editor/canvas-relation-intents.ts
          apps/gui-to-code/src/editor/canvas-relation-intents.spec.ts
          apps/gui-to-code/src/editor/contracts.ts
          apps/gui-to-code/src/editor/language-services-adapter.ts
          apps/gui-to-code/src/editor/workspace.ts
          apps/gui-to-code/src/editor/workspace.spec.ts
          apps/gui-to-code/src/editor/workspace.integration.spec.ts
          apps/gui-to-code/README.md
          apps/gui-to-code/ROADMAP.STATUS.md
          .changeset/bright-ravens-connect.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'Formatting already clean'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/language-services \
            packages/diagram \
            apps/gui-to-code \
            .changeset/bright-ravens-connect.md
          git commit -m "style: format WP-03 changes"
          git push origin HEAD:feat/gui-to-code-wp03-relation-undo
